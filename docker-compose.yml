version: "3.2"

networks:
  neatlogic:
    driver: bridge

services:
  neatlogic-db:
    image: harbor.neatlogic.com:8033/library/neatlogic/neatlogic-db:V4.0.0
    container_name: neatlogic-db
    restart: always
    stdin_open: true
    tty: true
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -pneatlogic@901 -e 'USE neatlogic;USE neatlogic_demo;USE neatlogic_demo_data'"]
      interval: 5s
      timeout: 30s
      retries: 300
      start_period: 10s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - /app/neatlogic-db/data:/var/lib/mysql
      - /app/neatlogic-db/conf:/etc/mysql/conf.d
      - /app/neatlogic-db/logs:/var/log/mysql
      - /app/neatlogic-db/mysql-files:/var/lib/mysql-files
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: "neatlogic@901" # 设置数据库root密码
      NEATLOGIC_RUNNER_HOST: "192.168.1.93" # 设置宿主机IP地址，请根据实际情况修改
      MONGO_INITDB_ROOT_PASSWORD: "neatlogic901"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    networks:
      - neatlogic
      
  neatlogic-collectdb:
    image: harbor.neatlogic.com:8033/library/neatlogic/neatlogic-collectdb:V4.0.0
    container_name: neatlogic-collectdb
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - type: volume
        source: collectdb_data
        target: /data/db
    ports:
      - "27017:27017"
    extra_hosts:
      - "neatlogic-collectdb:127.0.0.1"

    #command: ["mongod", "--replSet", "autoexec-rs"]
    healthcheck:
      test: ["CMD-SHELL", "/bin/mongosh --host 127.0.0.1 --port 27017 -u admin -p neatlogic901 --authenticationDatabase admin --quiet --eval '\
        dbs = db.getMongo().getDBNames(); \
        rsOK = false; \
        try { \
          rsStatus = rs.status(); \
          rsOK = rsStatus.ok === 1; \
        } catch(e) {} \
        if([\"autoexec\"].every(dbname => dbs.indexOf(dbname) >= 0) && rsOK){quit(0)} else {quit(1)}'"]
      interval: 5s
      timeout: 30s
      retries: 300
      start_period: 10s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535    
    environment:
      MONGO_INITDB_ROOT_PASSWORD: "neatlogic901"
      MONGO_INITDB_ROOT_USERNAME: "admin" 
    networks:
      - neatlogic
      
  neatlogic-app:
    image: harbor.neatlogic.com:8033/library/neatlogic/neatlogic-app:V4.0.0
    container_name: neatlogic-app
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - /app/neatlogic-app/logs/:/app/logs/neatlogic/
    ports:
      - "8282:8282"
      - "9977:9977"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://neatlogic-app:8282/neatlogic/tenant/check/demo"]
      interval: 10s
      timeout: 30s
      retries: 300
      start_period: 100s
    depends_on:
      neatlogic-db:
        condition: service_healthy
      neatlogic-collectdb:
        condition: service_healthy
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      NEATLOGIC_HOME: "/app"
      MYSQL_SERVICE_PASSWORD: "neatlogic@901"
      TENANT_NAME: "demo"
    networks:
      - neatlogic

  neatlogic-runner:
    image: harbor.neatlogic.com:8033/library/neatlogic/neatlogic-runner:V4.0.0
    container_name: neatlogic-runner
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - /app/neatlogic-runner/logs/:/app/logs/neatlogic-runner/
      - /app/neatlogic-runner/autoexec/tools/:/app/autoexec/tools/
      - type: volume
        source: autoexec_data
        target: /app/autoexec/data/
    ports:
      - "8084:8084"
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://neatlogic-runner:8084/autoexecrunner/anonymous/api/rest/server/health/check/demo"]
      interval: 10s
      timeout: 30s
      retries: 300
      start_period: 100s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NEATLOGIC_HOME=/app
    networks:
      - neatlogic
    depends_on:
      neatlogic-db:
        condition: service_healthy
      neatlogic-collectdb:
        condition: service_healthy
      neatlogic-app:
        condition: service_healthy  
      
  neatlogic-web:
    image: harbor.neatlogic.com:8033/library/neatlogic/neatlogic-web:V4.0.0
    container_name: neatlogic-web
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - /app/neatlogic-web/logs/:/app/logs/nginx/
    ports:
      - "8090:8090"
      - "9098:9098"
      - "9099:9099"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://neatlogic-web:8090/demo/tenant/check"]
      interval: 10s
      timeout: 30s
      retries: 300
      start_period: 100s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NEATLOGIC_HOME=/app
    networks:
      - neatlogic
    depends_on:
      neatlogic-app:
        condition: service_healthy



volumes:
  collectdb_data: 
  autoexec_data: 
